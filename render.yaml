services:
  # Backend Express API
  - type: web
    name: expo26-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: CORS_ORIGIN
        sync: false        # Set to your Netlify URL e.g. https://expo26.netlify.app
      - key: PORT
        value: 10000       # Render uses port 10000
